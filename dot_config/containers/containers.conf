[engine]
# `podman compose` / `docker compose` hand off to docker-compose (talking to the
# rootless podman socket); don't print the "external compose provider" banner.
compose_providers = ["docker-compose"]
compose_warning_logs = false

[machine]
# macOS only: the VM `podman machine init` creates. The default is 2048 MiB.
memory = 8192
