# hyprlock: Dracula, square corners to match Hyprland.
# Clear the password buffer with Esc, Ctrl+U or Ctrl+Backspace.

$font = JetBrains Mono

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 1
    inner_color = rgba(1e1f28cc)
    outer_color = rgba(50fa7bee)
    check_color = rgba(bd92f8ee)
    fail_color = rgba(ff5555ee)
    font_color = rgb(248, 248, 242)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = <span foreground="##6272a4">password</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(f8f8f2ff)
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(8ae9fcff)
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

# HOST
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(cat /proc/sys/kernel/hostname)"
    color = rgba(50fa7bff)
    font_size = 14
    font_family = $font

    position = 0, 30
    halign = center
    valign = bottom
}
