# hypridle: dim -> lock -> screen off. Lid close / suspend locks first.
# No auto-suspend on purpose (long builds); add a listener with
# `on-timeout = systemctl suspend` if you want one on battery.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # one instance only
    before_sleep_cmd = loginctl lock-session                          # lock before suspend / lid close
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume
}

listener {
    timeout = 150                         # 2.5 min: dim (acpi_video0)
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                         # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                         # 5.5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
