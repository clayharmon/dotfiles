# ~/.config/kitty/kitty.conf
# Overrides only. `kitty --debug-config` prints the effective config, and
# `kitten choose-fonts` picks fonts. Reload a running kitty with
# `kill -SIGUSR1 (pgrep -x kitty)` or ctrl+cmd+,
# Shared by every machine. OS-specific settings live in macos.conf and
# linux.conf, pulled in by the include at the bottom.

# Font
font_family JetBrains Mono
font_size 16.0

# Cursor and scrollback
cursor_shape block
cursor_blink_interval 0.5
scrollback_lines 10000

# URLs
url_color #8ae9fc
url_style curly
detect_urls yes

# Window
window_padding_width 4
background_opacity 0.8
background_blur 20
dynamic_background_opacity yes
include ./theme.conf

# Shell
shell_integration enabled
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# Keys
kitty_mod super
map kitty_mod+e launch nvim .

# kitty sets KITTY_OS to macos or linux. Last, so it can override the above.
include ${KITTY_OS}.conf

# Machine-local overrides, not in the dotfiles repo. globinclude skips a missing file.
globinclude local.conf
