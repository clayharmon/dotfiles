# macOS: herdr owns tabs and splits, AeroSpace owns the window.

# Clipboard and bell
copy_on_select yes
enable_audio_bell no

# yes, not titlebar-only: titlebar-only keeps the traffic lights, which float
# over the terminal in kitty 0.48. AeroSpace owns the window, so no buttons needed.
hide_window_decorations yes
# herdr owns tabs and splits, so kitty's tab bar stays hidden.
tab_bar_style hidden
confirm_os_window_close 0

# Chords that belong to herdr (see ~/.config/herdr/config.toml).
# no_op unmaps the key in kitty and passes it to the program running inside.
map cmd+enter       no_op
map cmd+shift+enter no_op
map cmd+z           no_op
map cmd+d           no_op
map cmd+r           no_op
map cmd+n           no_op
map cmd+t           no_op
map cmd+h           no_op
map cmd+j           no_op
map cmd+k           no_op
map cmd+l           no_op
map cmd+g           no_op
map cmd+shift+j     no_op
map cmd+shift+k     no_op
map cmd+i           no_op
map cmd+shift+e     no_op
map cmd+shift+r     no_op
map cmd+1           no_op
map cmd+2           no_op
map cmd+3           no_op
map cmd+4           no_op
map cmd+5           no_op
map cmd+6           no_op
map cmd+7           no_op
map cmd+8           no_op
map cmd+9           no_op
