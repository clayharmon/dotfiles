# tmux: prefix stays Ctrl-b (same as herdr's default), vim-style panes.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
setw -g mode-keys vi

# splits keep the current directory (prefix - / prefix |, like herdr)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Dracula status line
set -g status-style "bg=#1e1f28,fg=#f8f8f2"
set -g status-left "#[fg=#50fa7b]#S "
set -g status-right "#[fg=#8ae9fc]%H:%M"
setw -g window-status-current-style "fg=#50fa7b,bold"
set -g pane-active-border-style "fg=#50fa7b"
set -g pane-border-style "fg=#44475a"
